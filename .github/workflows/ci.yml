# Format, lint, typecheck and both test suites. Called directly by a push to main
# or a pull request, and by release.yml before it publishes, so a release runs
# exactly the build that guards main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  BUN_VERSION: '1.4.2'

jobs:
  check:
    name: format, lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run check

  test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run test

  # The committed demo store, converted to SQLite and loaded into a real Postgres
  # and a real MySQL. Those tests skip themselves when they have no server or no
  # client, and a skip is not a pass, so all of it is provided here and checked for.
  integration:
    name: integration (demo store, SQLite, Postgres and MySQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -ptest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      BACPAC_TEST_POSTGRES: postgres://postgres:test@localhost:5432/postgres
      BACPAC_TEST_MYSQL: mysql://root:test@localhost:3306
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Check psql and mysql are available
        run: psql --version && mysql --version
      - run: bun run test:integration
