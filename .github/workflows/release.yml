# A tag push runs the whole CI build, then publishes the package to npm.
#
# Needs an NPM_TOKEN secret with publish rights to the package.
name: Release

# Titles the run with the tag, rather than with the tagged commit's message.
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}

env:
  BUN_VERSION: '1.4.2'

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Signs npm provenance from this workflow's identity.
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # For the npm CLI, which publishes, and the .npmrc it authenticates with.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile

      - name: Check the tag matches the package version
        run: |
          version="$(bun --print 'require("./package.json").version')"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match @kineco-au/bacpac-importer@$version" >&2
            exit 1
          fi

      # A version the registry already holds is skipped, so re-running a release is safe.
      - name: Publish
        run: |
          version="$(bun --print 'require("./package.json").version')"
          url="https://www.npmjs.com/package/@kineco-au/bacpac-importer/v/$version"
          if npm view "@kineco-au/bacpac-importer@$version" version >/dev/null 2>&1; then
            outcome="was already published; nothing to do"
          else
            npm publish --access public --provenance
            outcome="published"
          fi
          # The link goes in the log, as an annotation on the run, and on its summary page.
          echo "@kineco-au/bacpac-importer@$version $outcome: $url"
          echo "::notice title=npm::@kineco-au/bacpac-importer@$version $outcome: $url"
          echo "### [@kineco-au/bacpac-importer@$version]($url) $outcome" >> "$GITHUB_STEP_SUMMARY"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
